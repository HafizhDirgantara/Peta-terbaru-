<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peta Potensi — Kec. Tongauna Utara</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin=""/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#1a7a4a;--green2:#2ea06a;--pale:#e8f5ee;--slate:#1e293b;--mid:#475569;--light:#94a3b8;--shadow:0 2px 12px rgba(0,0,0,.12)}
body{font-family:system-ui,sans-serif;background:#f1f5f2;color:var(--slate);height:100vh;overflow:hidden;display:flex;flex-direction:column}
header{background:var(--green);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.htitle{font-size:15px;font-weight:700}.hsub{font-size:11px;opacity:.75}
.hbadge{margin-left:auto;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:3px 10px;font-size:10px}
.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:272px;flex-shrink:0;background:#fff;display:flex;flex-direction:column;overflow:hidden;border-right:1px solid #e2e8f0}
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px;background:var(--pale);border-bottom:1px solid #c6e8d4}
.sbox{background:#fff;border-radius:8px;padding:8px 10px;border:1px solid #d1fae5}
.sval{font-size:18px;font-weight:700;color:var(--green)}
.slbl{font-size:10px;color:var(--mid);margin-top:1px;font-weight:500}
.controls{padding:8px 10px;border-bottom:1px solid #e2e8f0;display:flex;flex-direction:column;gap:6px}
.clbl{font-size:10px;font-weight:700;color:var(--light);text-transform:uppercase;letter-spacing:.5px}
.bgrp{display:flex;gap:4px;flex-wrap:wrap}
.btn{padding:5px 10px;border-radius:6px;border:1px solid #d1d5db;background:#fff;font-size:11px;font-weight:600;cursor:pointer;color:var(--mid);transition:.15s}
.btn:hover{background:var(--pale);border-color:var(--green);color:var(--green)}
.btn.active{background:var(--green);border-color:var(--green);color:#fff}
.trow{display:flex;gap:6px}
.tbtn{flex:1;padding:5px;border-radius:6px;border:1.5px solid #e2e8f0;background:#fff;font-size:11px;font-weight:600;cursor:pointer;color:var(--mid);transition:.15s;display:flex;align-items:center;justify-content:center;gap:4px}
.tbtn.active{background:var(--slate);border-color:var(--slate);color:#fff}
.vscroll{flex:1;overflow-y:auto}
.vlhdr{padding:7px 10px 4px;font-size:10px;font-weight:700;color:var(--light);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #f1f5f9}
.vi{padding:8px 10px;border-bottom:1px solid #f8fafc;cursor:pointer;transition:.12s;display:flex;align-items:center;gap:8px}
.vi:hover{background:var(--pale)}
.vi.active{background:var(--pale);border-left:3px solid var(--green)}
.vdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.vname{font-size:12px;font-weight:600}.vmeta{font-size:10px;color:var(--light);margin-top:1px}
.chart-area{padding:8px 10px;border-top:1px solid #e2e8f0}
.ctitle{font-size:10px;font-weight:700;color:var(--light);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.crow{display:flex;align-items:center;gap:4px;margin-bottom:3px}
.cname{font-size:9px;color:var(--mid);width:70px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cwrap{flex:1;background:#f1f5f9;border-radius:3px;height:10px;overflow:hidden}
.cfill{height:100%;border-radius:3px;transition:.4s}
.cval{font-size:9px;color:var(--mid);width:20px;text-align:right;flex-shrink:0}
#map{flex:1;z-index:0}
.mapc{position:relative;flex:1;overflow:hidden}
.mbtns{position:absolute;top:12px;right:12px;z-index:900;display:flex;flex-direction:column;gap:6px}
.mbtn{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:7px 12px;font-size:11px;font-weight:600;cursor:pointer;color:var(--slate);box-shadow:var(--shadow);transition:.15s;white-space:nowrap}
.mbtn:hover{background:var(--pale);border-color:var(--green);color:var(--green)}
.mbtn.active{background:var(--slate);color:#fff;border-color:var(--slate)}
.legend{position:absolute;bottom:16px;left:8px;z-index:800;background:#fff;border-radius:8px;box-shadow:var(--shadow);border:1px solid #e2e8f0;padding:8px 10px;min-width:110px}
.ltitle{font-size:9px;font-weight:700;color:var(--light);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.li{display:flex;align-items:center;gap:6px;margin-bottom:3px;font-size:10px;color:var(--slate)}
.lsw{width:12px;height:12px;border-radius:3px;flex-shrink:0;border:1px solid rgba(0,0,0,.1)}
.dp{position:absolute;bottom:16px;right:16px;width:232px;background:#fff;border-radius:8px;box-shadow:var(--shadow);border:1px solid #e2e8f0;z-index:800;overflow:hidden;transition:.2s;transform:translateY(20px);opacity:0;pointer-events:none}
.dp.show{transform:translateY(0);opacity:1;pointer-events:auto}
.dph{padding:10px 12px;background:var(--green);color:#fff;display:flex;justify-content:space-between;align-items:center}
.dpn{font-size:13px;font-weight:700}
.dpc{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;line-height:1}
.dpb{padding:10px 12px}
.dr{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #f1f5f9;font-size:12px}
.dr:last-child{border-bottom:none}
.dk{color:var(--mid);font-weight:500}.dv{font-weight:700;font-size:11px}
.dtags{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
.tag{background:var(--pale);border:1px solid #c6e8d4;color:var(--green);border-radius:12px;padding:2px 8px;font-size:10px;font-weight:600}
/* LOADING OVERLAY */
.loading{position:fixed;inset:0;background:rgba(26,122,74,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;color:#fff;gap:12px}
.spinner{width:40px;height:40px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{font-size:14px;font-weight:600;opacity:.9}
.loading small{font-size:11px;opacity:.7}
/* DATA SOURCE BADGE */
.dsrc{position:absolute;top:12px;left:8px;z-index:800;background:#fff;border-radius:8px;box-shadow:var(--shadow);border:1px solid #e2e8f0;padding:5px 10px;font-size:10px;color:var(--mid);display:flex;align-items:center;gap:5px}
.dsrc-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;flex-shrink:0}
.dsrc-dot.err{background:#ef4444}
.leaflet-tooltip{background:#fff;border:1px solid #e2e8f0;border-radius:6px;padding:4px 8px;font-size:11px;font-weight:600;color:var(--slate);box-shadow:var(--shadow)}
.vscroll::-webkit-scrollbar{width:3px}
.vscroll::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px}
</style>
</head>
<body>
<div class="loading" id="loading">
  <div class="spinner"></div>
  <p>Memuat data dari Google Sheets...</p>
  <small>Mohon tunggu sebentar</small>
</div>
<header>
  <div style="font-size:22px">🌾</div>
  <div><div class="htitle">Peta Potensi Pertanian</div><div class="hsub">Kec. Tongauna Utara · Kab. Konawe · Sultra</div></div>
  <div class="hbadge" id="lastupdate">v3.0 · 2025</div>
</header>
<div class="main">
  <div class="sidebar">
    <div class="stats-row">
      <div class="sbox"><div class="sval" id="st-poktan">-</div><div class="slbl">Total Poktan</div></div>
      <div class="sbox"><div class="sval" id="st-lahan">-</div><div class="slbl">Lahan (Ha)</div></div>
      <div class="sbox"><div class="sval" id="st-sawah">-</div><div class="slbl">Sawah (Ha)</div></div>
      <div class="sbox"><div class="sval">10</div><div class="slbl">Jumlah Desa</div></div>
    </div>
    <div class="controls">
      <div class="clbl">Warna Berdasarkan</div>
      <div class="bgrp">
        <button class="btn active" onclick="setColor('poktan',this)">Poktan</button>
        <button class="btn" onclick="setColor('lahan',this)">Lahan</button>
        <button class="btn" onclick="setColor('komoditas',this)">Komoditas</button>
      </div>
      <div class="trow">
        <button class="tbtn active" id="bp" onclick="setView('polygon')">▪ Batas Desa</button>
        <button class="tbtn" id="bb" onclick="setView('bubble')">● Bubble</button>
      </div>
    </div>
    <div class="vlhdr">Daftar Desa</div>
    <div class="vscroll"><div id="vlist"></div></div>
    <div class="chart-area">
      <div class="ctitle">Poktan per Desa</div>
      <div id="chart"></div>
    </div>
  </div>
  <div class="mapc">
    <div id="map"></div>
    <div class="dsrc"><div class="dsrc-dot" id="dsrc-dot"></div><span id="dsrc-txt">Google Sheets</span></div>
    <div class="mbtns">
      <button class="mbtn active" id="bsat" onclick="setTile('sat')">🛰 Satelit</button>
      <button class="mbtn" id="bosm" onclick="setTile('osm')">🗺 Peta</button>
    </div>
    <div class="legend" id="legend"></div>
    <div class="dp" id="dp">
      <div class="dph"><span class="dpn" id="dpname"></span><button class="dpc" onclick="closeDP()">×</button></div>
      <div class="dpb" id="dpbody"></div>
    </div>
  </div>
</div>
<script>
// Load Leaflet with fallback
function loadScript(url, fallback) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = url;
    s.onload = resolve;
    s.onerror = () => { if(fallback) loadScript(fallback).then(resolve).catch(reject); else reject(); };
    document.head.appendChild(s);
  });
}
</script>

<script>
// ============================================================
// KONFIGURASI — ganti SHEET_CSV_URL dengan URL publish Sheets
// ============================================================
const SHEET_CSV_URL = 'GANTI_DENGAN_URL_CSV_SHEETS_ANDA';

// Key mapping: nama desa di Sheets → key polygon
const NAME_MAP = {
  'ambopi':'ambopi','andalambe':'andalambe','anggohu':'anggohu',
  'barowila':'barowila','nambeaboru':'nambeaboru','olo onua':'olo_onua',
  'olua ao':'olua_ao','puundopi':'puundopi','sanuanggamo':'sanuanggamo',
  'waworoda jaya':'waworoda_jaya'
};

// Center per desa (fallback / label)
const CENTERS = {
  ambopi:[-3.754762,121.965769], andalambe:[-3.775172,121.972231],
  anggohu:[-3.778005,122.007412], barowila:[-3.747566,122.030649],
  nambeaboru:[-3.69633,122.025645], olo_onua:[-3.798395,122.04512],
  olua_ao:[-3.783187,122.011984], puundopi:[-3.78513,122.05188],
  sanuanggamo:[-3.794273,122.011629], waworoda_jaya:[-3.78143,121.997939]
};

const COM_COLOR={'Padi':'#1a7a4a','Jagung':'#f59e0b','Kakao':'#92400e',
  'Kelapa':'#065f46','Kedelai':'#d97706','Ubi':'#7c3aed'};
const GPOKTAN=['#0f4c2a','#1a7a4a','#2ea06a','#4ade80','#86efac'];
const GLAHAN =['#1e3a5f','#1d4ed8','#3b82f6','#93c5fd','#dbeafe'];

let VILLAGES = [];
let colorMode='poktan', viewMode='polygon', activeKey=null;
const polyLayers={}, bubLayers={};
const grpPoly=L.layerGroup(), grpBub=L.layerGroup();

const map=L.map('map',{zoomControl:true}).setView([-3.765,122.01],12);
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'&copy; Esri',maxZoom:18,crossOrigin:true});
const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap',maxZoom:19,crossOrigin:true});
const osmFallback=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap',maxZoom:19});
// Try satellite first, fallback to OSM if tiles fail
sat.addTo(map);
sat.on('tileerror', function() {
  if(map.hasLayer(sat)) {
    map.removeLayer(sat);
    osm.addTo(map);
    document.getElementById('bsat').classList.remove('active');
    document.getElementById('bosm').classList.add('active');
  }
});
grpPoly.addTo(map);

// ============================================================
// FETCH & PARSE CSV dari Google Sheets
// ============================================================
function parseCSV(text) {
  const lines = text.trim().split('\n').filter(l => l.trim());
  if (lines.length < 2) return [];
  const headers = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/"/g,''));
  return lines.slice(1).map(line => {
    // handle quoted commas
    const cols = [];
    let cur = '', inQ = false;
    for (const ch of line) {
      if (ch==='"') { inQ=!inQ; }
      else if (ch===',' && !inQ) { cols.push(cur.trim()); cur=''; }
      else { cur += ch; }
    }
    cols.push(cur.trim());
    const obj = {};
    headers.forEach((h,i) => obj[h] = (cols[i]||'').replace(/"/g,'').trim());
    return obj;
  });
}

async function loadSheets() {
  try {
    const res = await fetch(SHEET_CSV_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const rows = parseCSV(text);

    VILLAGES = rows.map(r => {
      const nameRaw = (r['desa'] || r['nama desa'] || r['nama'] || '').trim();
      const key = NAME_MAP[nameRaw.toLowerCase()] || nameRaw.toLowerCase().replace(/ /g,'_');
      const komoditasRaw = r['komoditas'] || '';
      const komoditas = komoditasRaw.split(/[,;]/).map(s=>s.trim()).filter(Boolean);
      return {
        key,
        name: nameRaw,
        center: CENTERS[key] || [-3.77, 122.01],
        poktan: parseInt(r['poktan'] || r['jumlah poktan'] || 0) || 0,
        sawah:  parseInt(r['sawah']  || r['lahan sawah']  || 0) || 0,
        kebun:  parseInt(r['kebun']  || r['lahan kebun']  || 0) || 0,
        komoditas: komoditas.length ? komoditas : ['-'],
      };
    }).filter(v => v.key);

    setSourceStatus(true, 'Data dari Google Sheets');
    const now = new Date();
    document.getElementById('lastupdate').textContent =
      `Update: ${now.getDate()}/${now.getMonth()+1}/${now.getFullYear()}`;
  } catch(e) {
    console.warn('Sheets error, pakai data fallback:', e);
    setSourceStatus(false, 'Data lokal (offline)');
    VILLAGES = FALLBACK;
  }
  document.getElementById('loading').style.display='none';
  updateStats(); refresh();
}

function setSourceStatus(ok, txt) {
  document.getElementById('dsrc-dot').className = 'dsrc-dot' + (ok ? '' : ' err');
  document.getElementById('dsrc-txt').textContent = txt;
}

// ============================================================
// DATA FALLBACK (dipakai jika Sheets belum dikonfigurasi/offline)
// ============================================================
const FALLBACK = [
  {key:'ambopi',       name:'Ambopi',        center:[-3.754762,121.965769], poktan:3,sawah:45,kebun:30, komoditas:['Padi','Jagung']},
  {key:'andalambe',    name:'Andalambe',     center:[-3.775172,121.972231], poktan:4,sawah:60,kebun:25, komoditas:['Padi','Kakao']},
  {key:'anggohu',      name:'Anggohu',       center:[-3.778005,122.007412], poktan:2,sawah:30,kebun:40, komoditas:['Jagung','Kelapa']},
  {key:'barowila',     name:'Barowila',      center:[-3.747566,122.030649], poktan:5,sawah:80,kebun:50, komoditas:['Padi','Jagung','Kedelai']},
  {key:'nambeaboru',   name:'Nambeaboru',    center:[-3.69633, 122.025645], poktan:3,sawah:55,kebun:35, komoditas:['Padi','Kakao']},
  {key:'olo_onua',     name:'Olo Onua',      center:[-3.798395,122.04512],  poktan:4,sawah:70,kebun:45, komoditas:['Padi','Jagung']},
  {key:'olua_ao',      name:'Olua Ao',       center:[-3.783187,122.011984], poktan:2,sawah:25,kebun:20, komoditas:['Kelapa','Kakao']},
  {key:'puundopi',     name:'Puundopi',      center:[-3.78513, 122.05188],  poktan:5,sawah:90,kebun:60, komoditas:['Padi','Jagung','Ubi']},
  {key:'sanuanggamo',  name:'Sanuanggamo',   center:[-3.794273,122.011629], poktan:3,sawah:40,kebun:30, komoditas:['Padi','Kelapa']},
  {key:'waworoda_jaya',name:'Waworoda Jaya', center:[-3.78143, 121.997939], poktan:4,sawah:65,kebun:42, komoditas:['Padi','Jagung','Kakao']},
];

// ============================================================
// RENDER
// ============================================================
function grad(key) {
  const v = VILLAGES.find(x=>x.key===key);
  if (!v) return '#94a3b8';
  if (colorMode==='komoditas') return COM_COLOR[v.komoditas[0]] || '#94a3b8';
  const G = colorMode==='poktan' ? GPOKTAN : GLAHAN;
  const vals = colorMode==='poktan' ? VILLAGES.map(x=>x.poktan) : VILLAGES.map(x=>x.sawah+x.kebun);
  const mx = Math.max(...vals, 1);
  const cur = colorMode==='poktan' ? v.poktan : (v.sawah+v.kebun);
  return G[Math.min(4, Math.floor(cur/mx*5))];
}

function buildPolygons() {
  grpPoly.clearLayers();
  VILLAGES.forEach(v => {
    const pts = POLYGONS[v.key]; if (!pts) return;
    const p = L.polygon(pts,{color:'#fff',weight:1.5,fillColor:grad(v.key),fillOpacity:.55});
    p.bindTooltip(v.name,{sticky:true,direction:'top'});
    p.on('click',()=>pick(v.key));
    grpPoly.addLayer(p); polyLayers[v.key]=p;
  });
}
function buildBubbles() {
  grpBub.clearLayers();
  const mx = Math.max(...VILLAGES.map(x=>x.poktan), 1);
  VILLAGES.forEach(v => {
    const r = 8+(v.poktan/mx)*22;
    const c = L.circleMarker(v.center,{radius:r,color:'#fff',weight:2,fillColor:grad(v.key),fillOpacity:.8});
    c.bindTooltip(`${v.name}: ${v.poktan} Poktan`,{sticky:true});
    c.on('click',()=>pick(v.key));
    grpBub.addLayer(c); bubLayers[v.key]=c;
  });
}
function buildList() {
  const el = document.getElementById('vlist'); el.innerHTML='';
  VILLAGES.forEach(v => {
    const d = document.createElement('div');
    d.className = 'vi'+(activeKey===v.key?' active':''); d.id='vi_'+v.key;
    d.innerHTML = `<div class="vdot" style="background:${grad(v.key)}"></div>
      <div><div class="vname">${v.name}</div>
      <div class="vmeta">${v.poktan} Poktan &middot; ${v.sawah+v.kebun} Ha</div></div>`;
    d.onclick = ()=>pick(v.key); el.appendChild(d);
  });
}
function buildChart() {
  const el = document.getElementById('chart'); el.innerHTML='';
  const mx = Math.max(...VILLAGES.map(x=>x.poktan), 1);
  [...VILLAGES].sort((a,b)=>b.poktan-a.poktan).forEach(v => {
    const pct = Math.round(v.poktan/mx*100);
    el.innerHTML += `<div class="crow">
      <div class="cname">${v.name}</div>
      <div class="cwrap"><div class="cfill" style="width:${pct}%;background:${grad(v.key)}"></div></div>
      <div class="cval">${v.poktan}</div></div>`;
  });
}
function buildLegend() {
  const el = document.getElementById('legend'); el.innerHTML='<div class="ltitle">Legenda</div>';
  if (colorMode==='komoditas') {
    const seen = new Set();
    VILLAGES.forEach(v => v.komoditas.forEach(c => seen.add(c)));
    seen.forEach(k => { if(COM_COLOR[k]) el.innerHTML+=`<div class="li"><div class="lsw" style="background:${COM_COLOR[k]}"></div>${k}</div>`; });
  } else {
    const G = colorMode==='poktan' ? GPOKTAN : GLAHAN;
    [['Rendah',0],['Sedang',2],['Tinggi',4]].forEach(([l,i])=>{
      el.innerHTML+=`<div class="li"><div class="lsw" style="background:${G[i]}"></div>${l}</div>`;
    });
  }
}
function updateStats() {
  document.getElementById('st-poktan').textContent = VILLAGES.reduce((s,v)=>s+v.poktan,0);
  document.getElementById('st-lahan').textContent  = VILLAGES.reduce((s,v)=>s+v.sawah+v.kebun,0);
  document.getElementById('st-sawah').textContent  = VILLAGES.reduce((s,v)=>s+v.sawah,0);
}
function pick(key) {
  activeKey=key; const v=VILLAGES.find(x=>x.key===key); if(!v) return;
  document.querySelectorAll('.vi').forEach(e=>e.classList.remove('active'));
  const li=document.getElementById('vi_'+key);
  if (li){li.classList.add('active');li.scrollIntoView({block:'nearest'});}
  if (viewMode==='polygon'&&polyLayers[key]) {
    map.fitBounds(polyLayers[key].getBounds(),{padding:[30,30]});
    Object.values(polyLayers).forEach(p=>p.setStyle({weight:1.5,color:'#fff'}));
    polyLayers[key].setStyle({weight:3,color:'#ffe066'});
  } else if (viewMode==='bubble'&&bubLayers[key]) {
    map.setView(v.center,14);
  }
  document.getElementById('dpname').textContent=v.name;
  document.getElementById('dpbody').innerHTML=`
    <div class="dr"><span class="dk">Jumlah Poktan</span><span class="dv">${v.poktan} kelompok</span></div>
    <div class="dr"><span class="dk">Lahan Sawah</span><span class="dv">${v.sawah} Ha</span></div>
    <div class="dr"><span class="dk">Lahan Kebun</span><span class="dv">${v.kebun} Ha</span></div>
    <div class="dr"><span class="dk">Total Lahan</span><span class="dv">${v.sawah+v.kebun} Ha</span></div>
    <div class="dtags">${v.komoditas.map(c=>`<span class="tag">${c}</span>`).join('')}</div>`;
  document.getElementById('dp').classList.add('show');
}
function closeDP() {
  document.getElementById('dp').classList.remove('show'); activeKey=null;
  document.querySelectorAll('.vi').forEach(e=>e.classList.remove('active'));
  Object.values(polyLayers).forEach(p=>p.setStyle({weight:1.5,color:'#fff'}));
}
function setColor(mode,btn) {
  colorMode=mode;
  document.querySelectorAll('.bgrp .btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); refresh();
}
function setView(mode) {
  viewMode=mode;
  document.getElementById('bp').classList.toggle('active',mode==='polygon');
  document.getElementById('bb').classList.toggle('active',mode==='bubble');
  if(mode==='polygon'){map.removeLayer(grpBub);grpPoly.addTo(map);}
  else{map.removeLayer(grpPoly);grpBub.addTo(map);}
}
function setTile(t) {
  document.getElementById('bsat').classList.toggle('active',t==='sat');
  document.getElementById('bosm').classList.toggle('active',t==='osm');
  if(t==='sat'){map.removeLayer(osm);sat.addTo(map);}
  else{map.removeLayer(sat);osm.addTo(map);}
}
function refresh() {
  buildPolygons(); buildBubbles(); buildList(); buildChart(); buildLegend();
  if(viewMode==='polygon') grpPoly.addTo(map); else grpBub.addTo(map);
}

// ============================================================
// Force map to render correctly after page load
window.addEventListener('load', function() {
  setTimeout(function() {
    map.invalidateSize();
    // Force fit to Tongauna area
    map.setView([-3.765, 122.01], 12);
  }, 500);
});

// START — load dari Sheets, fallback jika belum dikonfigurasi
// ============================================================
if (SHEET_CSV_URL === 'GANTI_DENGAN_URL_CSV_SHEETS_ANDA') {
  setSourceStatus(false, 'Data lokal (Sheets belum diset)');
  VILLAGES = FALLBACK;
  document.getElementById('loading').style.display='none';
  updateStats(); refresh();
} else {
  loadSheets();
}
